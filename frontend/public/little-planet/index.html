<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/little-planet/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TroisJS - Procedural Low Poly Planet Generator</title>
  <script type="module" crossorigin src="/little-planet/assets/index.1ad1b7fd.js"></script>
  <link rel="modulepreload" href="/little-planet/assets/vendor.1d8dcb7d.js">
  <link rel="stylesheet" href="/little-planet/assets/index.25ea1f35.css">
  <style>
    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
    }

    body { cursor: grab !important; }
    body:active { cursor: grabbing !important; }
    canvas { background: transparent !important; }
    .tp-dfwv,
    .tp-rotv,
    [class^="tp-"] { display: none !important; }
  </style>
</head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const readyType = "home-little-planet-ready";
        const notifyParent = () => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              window.parent?.postMessage({ type: readyType }, window.location.origin);
            });
          });
        };

        const waitForCanvas = () => {
          if (document.querySelector("canvas")) {
            notifyParent();
            return;
          }

          const observer = new MutationObserver(() => {
            if (!document.querySelector("canvas")) return;
            observer.disconnect();
            notifyParent();
          });

          observer.observe(document.documentElement, { childList: true, subtree: true });
          window.setTimeout(() => {
            observer.disconnect();
            notifyParent();
          }, 7000);
        };

        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", waitForCanvas, { once: true });
        else waitForCanvas();
      })();
    </script>
  </body>
</html>
